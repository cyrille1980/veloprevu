# Pile complète VéloPrévu : docker compose up -d --build
#   API          http://localhost:8000/docs
#   MLflow       http://localhost:5000
#   Prometheus   http://localhost:9090
#   Grafana      http://localhost:3000   (admin / valeur de GRAFANA_ADMIN_PASSWORD)
#   MinIO        http://localhost:9001
# Les secrets viennent du fichier .env (voir .env.example), jamais de ce fichier.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d mlflow"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9001:9001"
    volumes:
      - donnees_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:   # crée le compartiment des artefacts MLflow, puis s'arrête
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/mlflow"

  mlflow:
    build:
      context: monitoring
      dockerfile: mlflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # --serve-artifacts : les clients déposent les artefacts via le serveur MLflow,
    # ils n'ont donc besoin d'aucun identifiant MinIO.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --serve-artifacts --artifacts-destination s3://mlflow
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 12

  api:
    image: ${IMAGE_API:-veloprevu-api:local}
    build: .
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      VELOPREVU_API_KEY: ${VELOPREVU_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs                    # journaux lus par Promtail
      - ./reports:/app/reports              # rapport de dérive exposé dans /metrics
      - ./models:/app/models                # copie de secours du champion
      - ./data/features:/app/data/features  # liste des stations
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alertes.yml:/etc/prometheus/alertes.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/veloprevu:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  donnees_postgres:
  donnees_minio:
