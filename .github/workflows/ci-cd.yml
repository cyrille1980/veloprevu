name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  # 1. Qualité du code et tests : barrière commune aux Pull Requests et à main.
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Qualité du code (Ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests unitaires et d'intégration (couverture minimale 80 %)
        run: pytest
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture
          path: coverage.xml

  # 2. Image Docker, puis déploiement dans un environnement de test et vérification du service.
  image-et-deploiement-test:
    needs: qualite-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Pipeline sur l'échantillon (produit un modèle pour l'environnement de test)
        run: python -m src.pipeline --source echantillon
      - name: Construire l'image
        run: docker build -t veloprevu-api:${{ github.sha }} .
      - name: Déployer dans l'environnement de test
        run: |
          docker run -d --name api-test -p 8000:8000 \
            -v "$PWD/models:/app/models" \
            -v "$PWD/data/features:/app/data/features" \
            veloprevu-api:${{ github.sha }}
      - name: Vérifier le service (test de fumée)
        run: python scripts/test_fumee.py http://localhost:8000
      - name: Journaux du conteneur en cas d'échec
        if: failure()
        run: docker logs api-test

  # 3. Sur main seulement : publication de l'image dans le registre GitHub (GHCR).
  publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-et-deploiement-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: nom   # GHCR exige un nom d'image en minuscules
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
            ${{ steps.nom.outputs.image }}:latest

  # 4. Déploiement automatique sur la machine cible (runner auto-hébergé).
  #    Activé en créant la variable de dépôt DEPLOIEMENT_ACTIF=true (voir le guide de mise en place).
  deploiement:
    if: vars.DEPLOIEMENT_ACTIF == 'true'
    needs: publication
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Mettre à jour l'API avec la nouvelle image
        env:
          IMAGE_API: ${{ needs.publication.outputs.image }}:${{ github.sha }}
        run: |
          docker compose pull api
          docker compose up -d --no-build api
      - name: Vérifier le service déployé
        run: python scripts/test_fumee.py http://localhost:8000
