[project]
name = "veloprevu"
version = "1.0.0"
description = "Prévision de la demande horaire BIXI par station : projet intégrateur MLOps"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]  # la longueur des lignes est gérée par le formateur

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning", "ignore::SyntaxWarning"]

[tool.coverage.run]
omit = ["src/llm_agents/evaluation.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
